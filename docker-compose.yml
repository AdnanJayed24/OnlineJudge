services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oj
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: online_judge
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend-go
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://oj:secret@postgres:5432/online_judge?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_in_prod_2}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pg_data:
